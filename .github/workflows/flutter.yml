name: Flutter CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'flutter-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'flutter-app/**'

env:
  FLUTTER_VERSION: '3.19.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd flutter-app
          flutter pub get

      - name: Generate code
        run: |
          cd flutter-app
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: |
          cd flutter-app
          flutter analyze

      - name: Run tests
        run: |
          cd flutter-app
          flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./flutter-app/coverage/lcov.info

  build-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd flutter-app
          flutter pub get

      - name: Generate code
        run: |
          cd flutter-app
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: |
          cd flutter-app
          flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: |
          cd flutter-app
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: flutter-app/build/app/outputs/flutter-apk/*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: flutter-app/build/app/outputs/bundle/release/*.aab

      - name: Upload to Play Store Internal
        if: github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.familyman.app
          releaseFiles: flutter-app/build/app/outputs/bundle/release/*.aab
          track: internal

  build-ios:
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd flutter-app
          flutter pub get

      - name: Generate code
        run: |
          cd flutter-app
          dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: |
          cd flutter-app/ios
          pod install --repo-update

      - name: Build iOS
        run: |
          cd flutter-app
          flutter build ios --release --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: flutter-app/build/ios/iphoneos/Runner.app

      - name: Deploy to TestFlight
        if: github.ref == 'refs/heads/main'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: flutter-app/build/ios/iphoneos/Runner.app
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}